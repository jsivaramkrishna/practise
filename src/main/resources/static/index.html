<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
        }

        .section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #2c3e50;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #764ba2;
        }

        button:active {
            transform: scale(0.98);
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .results-section {
            grid-column: 1 / -1;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #764ba2;
        }

        .results-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table thead {
            background: #667eea;
            color: white;
        }

        table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        table tbody tr:hover {
            background: #e8eaf6;
        }

        .status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #6c757d;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 Employee Management System</h1>
            <p>Manage employees with salary tracking</p>
        </div>

        <div class="content">
            <!-- Add Employee Section -->
            <div class="section">
                <h2>➕ Add New Employee</h2>
                <div id="addMessage"></div>
                <form id="addEmployeeForm">
                    <div class="form-group">
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" placeholder="e.g., John" required>
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" placeholder="e.g., Doe" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" placeholder="e.g., john@company.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" placeholder="e.g., +1-234-567-8900">
                    </div>
                    <div class="form-group">
                        <label for="hireDate">Hire Date *</label>
                        <input type="date" id="hireDate" required>
                    </div>
                    <div class="form-group">
                        <label for="jobTitle">Job Title</label>
                        <input type="text" id="jobTitle" placeholder="e.g., Senior Developer">
                    </div>
                    <div class="form-group">
                        <label for="department">Department</label>
                        <input type="text" id="department" placeholder="e.g., Engineering">
                    </div>
                    <div class="form-group">
                        <label for="salary">Salary</label>
                        <input type="number" id="salary" placeholder="e.g., 75000" step="0.01">
                    </div>
                    <button type="submit">Add Employee</button>
                </form>
            </div>

            <!-- Query Section -->
            <div class="section">
                <h2>🔍 Query Employees</h2>
                <div class="button-group">
                    <button onclick="getAllEmployees()">📋 Get All</button>
                    <button onclick="getHighEarners()">💰 Salary > $80K</button>
                </div>
                <div class="button-group" style="margin-top: 10px;">
                    <input type="number" id="yearInput" placeholder="Enter year (e.g., 2024)" min="2020" max="2099" style="width: 60%;">
                    <button onclick="getEmployeesHiredInYear()" style="width: 40%;">📅 Hired in Year</button>
                </div>
            </div>

            <!-- Results Section -->
            <div class="results-section">
                <h2>📊 Results</h2>
                <div id="resultMessage"></div>
                <div id="results"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/employees';

        // Add Employee Form Submission
        document.getElementById('addEmployeeForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const employee = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value || null,
                hireDate: document.getElementById('hireDate').value,
                jobTitle: document.getElementById('jobTitle').value || null,
                department: document.getElementById('department').value || null,
                salary: document.getElementById('salary').value ? parseFloat(document.getElementById('salary').value) : null,
                status: 'Active'
            };

            try {
                showMessage('addMessage', 'Sending...', 'info');
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(employee)
                });

                if (response.ok) {
                    const data = await response.json();
                    showMessage('addMessage', `✅ Employee "${data.firstName} ${data.lastName}" added successfully!`, 'success');
                    document.getElementById('addEmployeeForm').reset();
                    setTimeout(getAllEmployees, 1000);
                } else {
                    const error = await response.text();
                    showMessage('addMessage', `❌ Error: ${error}`, 'error');
                }
            } catch (error) {
                showMessage('addMessage', `❌ Error: ${error.message}`, 'error');
            }
        });

        // Get All Employees
        async function getAllEmployees() {
            try {
                showMessage('resultMessage', 'Loading all employees...', 'info');
                const response = await fetch(API_URL);
                const employees = await response.json();

                if (employees.length === 0) {
                    displayResults('No employees found', 'empty');
                    showMessage('resultMessage', '', '');
                } else {
                    displayEmployeeTable(employees, `All Employees (${employees.length} total)`);
                    showMessage('resultMessage', `✅ Found ${employees.length} employees`, 'success');
                }
            } catch (error) {
                displayResults(`Error: ${error.message}`, 'error');
                showMessage('resultMessage', '❌ Error loading employees', 'error');
            }
        }

        // Get High Earners (> $80,000)
        async function getHighEarners() {
            try {
                showMessage('resultMessage', 'Loading high earners...', 'info');
                const response = await fetch(`${API_URL}/high-earners`);
                const employees = await response.json();

                if (employees.length === 0) {
                    displayResults('No employees earning more than $80,000', 'empty');
                    showMessage('resultMessage', 'ℹ️ No high earners found', 'info');
                } else {
                    displayEmployeeTable(employees, `Employees Earning > $80,000 (${employees.length} found)`);
                    showMessage('resultMessage', `✅ Found ${employees.length} high earners`, 'success');
                }
            } catch (error) {
                displayResults(`Error: ${error.message}`, 'error');
                showMessage('resultMessage', '❌ Error loading high earners', 'error');
            }
        }

        // Get Employees Hired in a Specific Year
        async function getEmployeesHiredInYear() {
            const year = document.getElementById('yearInput').value;
            
            if (!year) {
                showMessage('resultMessage', '⚠️ Please enter a year', 'error');
                return;
            }

            try {
                showMessage('resultMessage', `Loading employees hired in ${year}...`, 'info');
                const response = await fetch(`${API_URL}/hired-in/${year}`);
                const employees = await response.json();

                if (employees.length === 0) {
                    displayResults(`No employees hired in ${year}`, 'empty');
                    showMessage('resultMessage', `ℹ️ No employees found hired in ${year}`, 'info');
                } else {
                    displayEmployeeTable(employees, `Employees Hired in ${year} (${employees.length} found)`);
                    showMessage('resultMessage', `✅ Found ${employees.length} employees hired in ${year}`, 'success');
                }
            } catch (error) {
                displayResults(`Error: ${error.message}`, 'error');
                showMessage('resultMessage', '❌ Error loading employees', 'error');
            }
        }

        // Display Employee Table
        function displayEmployeeTable(employees, title) {
            let html = `<h3>${title}</h3><table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Job Title</th>
                        <th>Department</th>
                        <th>Hire Date</th>
                        <th>Salary</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>`;

            employees.forEach(emp => {
                html += `<tr>
                    <td>${emp.employeeId}</td>
                    <td>${emp.firstName}</td>
                    <td>${emp.lastName}</td>
                    <td>${emp.email}</td>
                    <td>${emp.phone || 'N/A'}</td>
                    <td>${emp.jobTitle || 'N/A'}</td>
                    <td>${emp.department || 'N/A'}</td>
                    <td>${emp.hireDate || 'N/A'}</td>
                    <td>${emp.salary ? '$' + parseFloat(emp.salary).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : 'N/A'}</td>
                    <td><span class="status status-active">${emp.status || 'Active'}</span></td>
                </tr>`;
            });

            html += `</tbody></table>`;
            document.getElementById('results').innerHTML = html;
        }

        // Display Generic Results
        function displayResults(message, type) {
            const resultsDiv = document.getElementById('results');
            if (type === 'empty' || type === 'error') {
                resultsDiv.innerHTML = `<div class="no-data">${message}</div>`;
            } else {
                resultsDiv.innerHTML = `<div class="loading">${message}</div>`;
            }
        }

        // Show Message
        function showMessage(elementId, message, type) {
            const messageDiv = document.getElementById(elementId);
            messageDiv.textContent = message;
            messageDiv.className = 'message ' + type;
            if (!message) messageDiv.className = 'message';
        }

        // Load all employees on page load
        window.addEventListener('load', () => {
            getAllEmployees();
        });
    </script>
</body>
</html>
